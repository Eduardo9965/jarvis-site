```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS</title>

    <style>
        body {
            margin: 0;
            background: #05070a;
            color: #00eaff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            font-size: 60px;
            letter-spacing: 8px;
            margin-bottom: 10px;
        }

        .status {
            color: #66ff99;
            margin-bottom: 30px;
        }

        .chat {
            background: #0b1017;
            border: 1px solid #00eaff;
            border-radius: 15px;
            padding: 20px;
            min-height: 300px;
            text-align: left;
            box-shadow: 0 0 25px rgba(0, 234, 255, 0.2);
        }

        .message {
            margin: 15px 0;
        }

        .jarvis {
            color: #00eaff;
        }

        .user {
            color: white;
        }

        .input-area {
            display: flex;
            margin-top: 20px;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #00eaff;
            background: #0b1017;
            color: white;
            font-size: 16px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #00eaff;
            color: #001014;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>JARVIS</h1>

        <div class="status">
            ● SISTEMA ONLINE
        </div>

        <div class="chat" id="chat">

            <div class="message jarvis">
                JARVIS: Olá. Sistema inicializado. Como posso ajudar?
            </div>

        </div>

        <div class="input-area">
            <input
                type="text"
                id="message"
                placeholder="Digite uma mensagem..."
                onkeydown="if(event.key === 'Enter') enviar()"
            >

            <button onclick="enviar()">ENVIAR</button>
        </div>

    </div>

    <script>
        function enviar() {

            const input = document.getElementById("message");
            const chat = document.getElementById("chat");

            const texto = input.value.trim();

            if (texto === "") {
                return;
            }

            const usuario = document.createElement("div");
            usuario.className = "message user";
            usuario.innerText = "VOCÊ: " + texto;

            chat.appendChild(usuario);

            input.value = "";

            const resposta = document.createElement("div");
            resposta.className = "message jarvis";
            resposta.innerText =
                "JARVIS: Recebi sua mensagem. A conexão com a inteligência artificial será adicionada na próxima etapa.";

            chat.appendChild(resposta);

            chat.scrollTop = chat.scrollHeight;
        }
    </script>

</body>
</html>
