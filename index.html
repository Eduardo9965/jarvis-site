```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>
body {
    margin: 0;
    background: #05080d;
    color: #00eaff;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

h1 {
    text-align: center;
    font-size: 60px;
    letter-spacing: 10px;
}

.status {
    text-align: center;
    color: #00ff88;
    margin-bottom: 25px;
}

.chat {
    height: 450px;
    overflow-y: auto;
    border: 1px solid #00eaff;
    border-radius: 15px;
    padding: 20px;
    background: #0a1018;
}

.msg {
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
}

.jarvis {
    color: #00eaff;
    background: #071820;
}

.user {
    color: white;
    background: #151515;
}

.area {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

input {
    flex: 1;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #00eaff;
    background: #080d13;
    color: white;
    font-size: 16px;
}

button {
    padding: 15px 20px;
    border: none;
    border-radius: 10px;
    background: #00eaff;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>JARVIS</h1>

<div class="status">
● SISTEMA ONLINE
</div>

<div class="chat" id="chat">

<div class="msg jarvis">
JARVIS: Olá. Estou pronto para ajudar.
</div>

</div>

<div class="area">

<input
id="entrada"
type="text"
placeholder="Digite sua pergunta..."
onkeydown="if(event.key === 'Enter') enviar()"
>

<button onclick="enviar()">ENVIAR</button>

</div>

</div>

<script>

function falar(texto) {

    const voz = new SpeechSynthesisUtterance(texto);

    voz.lang = "pt-BR";
    voz.rate = 1;
    voz.pitch = 1;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(voz);
}


function responder(texto) {

    texto = texto.toLowerCase();

    if (texto.includes("olá") || texto.includes("oi")) {

        return "Olá. É um prazer falar com você.";

    }

    if (texto.includes("seu nome")) {

        return "Meu nome é JARVIS.";

    }

    if (texto.includes("como você está")) {

        return "Estou funcionando perfeitamente.";

    }

    if (texto.includes("horas")) {

        const agora = new Date();

        return "Agora são " +
        agora.getHours() +
        " horas e " +
        agora.getMinutes() +
        " minutos.";

    }

    if (texto.includes("quem é você")) {

        return "Eu sou o JARVIS, seu assistente virtual.";

    }

    return "Entendi sua mensagem. Minha inteligência artificial completa ainda será conectada ao sistema.";

}


function enviar() {

    const entrada = document.getElementById("entrada");
    const chat = document.getElementById("chat");

    const texto = entrada.value.trim();

    if (texto === "") {
        return;
    }

    const usuario = document.createElement("div");

    usuario.className = "msg user";

    usuario.innerText = "VOCÊ: " + texto;

    chat.appendChild(usuario);

    entrada.value = "";

    const respostaTexto = responder(texto);

    const resposta = document.createElement("div");

    resposta.className = "msg jarvis";

    resposta.innerText = "JARVIS: " + respostaTexto;

    chat.appendChild(resposta);

    falar(respostaTexto);

    chat.scrollTop = chat.scrollHeight;

}

</script>

</body>
</html>
