<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI</title>

    <style>
        body {
            margin: 0;
            background: #05070a;
            color: #00eaff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 50px auto;
            text-align: center;
        }

        h1 {
            font-size: 60px;
            letter-spacing: 10px;
        }

        .status {
            color: #66ff99;
            margin-bottom: 25px;
        }

        .chat {
            height: 450px;
            overflow-y: auto;
            background: #0b1017;
            border: 1px solid #00eaff;
            border-radius: 15px;
            padding: 20px;
            text-align: left;
        }

        .message {
            margin: 15px 0;
            padding: 12px;
            border-radius: 10px;
        }

        .jarvis {
            color: #00eaff;
            background: #07151b;
        }

        .user {
            color: white;
            background: #151515;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #00eaff;
            background: #0b1017;
            color: white;
            font-size: 16px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #00eaff;
            color: #001014;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>JARVIS</h1>

    <div class="status">
        ● SISTEMA ONLINE
    </div>

    <div class="chat" id="chat">

        <div class="message jarvis">
            JARVIS: Olá. Estou pronto para conversar.
        </div>

    </div>

    <div class="input-area">

        <input
            id="message"
            type="text"
            placeholder="Digite sua mensagem..."
            onkeydown="if(event.key === 'Enter') enviar()"
        >

        <button onclick="enviar()">ENVIAR</button>

    </div>

</div>

<script>

async function enviar() {

    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    const texto = input.value.trim();

    if (!texto) {
        return;
    }

    const usuario = document.createElement("div");
    usuario.className = "message user";
    usuario.innerText = "VOCÊ: " + texto;

    chat.appendChild(usuario);

    input.value = "";

    const carregando = document.createElement("div");
    carregando.className = "message jarvis";
    carregando.innerText = "JARVIS: Pensando...";

    chat.appendChild(carregando);

    try {

        const resposta = await fetch("COLOQUE_AQUI_O_ENDERECO_DO_SERVIDOR", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                mensagem: texto
            })
        });

        const dados = await resposta.json();

        carregando.innerText = "JARVIS: " + dados.resposta;

    } catch (erro) {

        carregando.innerText =
            "JARVIS: Não consegui conectar ao servidor.";

    }

    chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
